[project]
name = "speech-to-translate"
version = "0.1.0"
description = "Local realtime voice translation for meetings and games"
requires-python = ">=3.12"

dependencies = [
  "numpy>=2.1",
  "torch>=2.7",
  "torchaudio>=2.7",
  "ctranslate2>=4.5",
  "sentencepiece>=0.2",
  "transformers>=4.48",
  "soundfile>=0.12",
  "onnxruntime>=1.20",
  "silero-vad>=5.1",
  "whisperlivekit>=0.2",
  "faster-whisper>=1.1",
  "PyAudioWPatch>=0.2.12",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "psutil>=6",
  "nvidia-ml-py>=12",
  "jiwer>=3",
  "edge-tts>=7",
  "websockets>=13",
  "fastapi>=0.115",
  "uvicorn>=0.34",
  "soxr>=0.5",
  "coqui-tts==0.27.5",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true


[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
